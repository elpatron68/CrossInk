<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CrossInk Mail Bridge</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <!-- PLAUSIBLE -->
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1a1a1a;
      --muted: #5a5a5a;
      --accent: #2c5f4a;
      --card: #fffdf8;
      --border: #d8d2c4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top, #fff8e8 0%, transparent 55%),
        linear-gradient(160deg, #ebe4d6 0%, var(--bg) 45%, #e2ddd2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    main {
      width: min(36rem, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem 1.75rem;
      box-shadow: 0 12px 40px rgba(0,0,0,0.06);
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
    }
    h2 { margin: 1.5rem 0 0.6rem; font-size: 1.15rem; }
    .lede {
      margin: 0 0 1.25rem;
      color: var(--muted);
      line-height: 1.45;
    }
    button {
      appearance: none;
      border: none;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 1.05rem;
      padding: 0.85rem 1.25rem;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    button.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      width: auto;
      padding: 0.35rem 0.7rem;
      font-size: 0.9rem;
    }
    button.linkish {
      background: transparent;
      color: var(--accent);
      border: none;
      width: auto;
      padding: 0.4rem 0;
      font-size: 0.95rem;
      text-decoration: underline;
    }
    .nav {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .nav button.linkish.active {
      font-weight: 700;
      text-decoration: none;
      border-bottom: 2px solid var(--accent);
      border-radius: 0;
      padding-bottom: 0.15rem;
    }
    input[type="text"] {
      width: 100%;
      font: inherit;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      margin-bottom: 0.75rem;
    }
    .drop {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      text-align: center;
      color: var(--muted);
      background: #f7f3ea;
      margin-top: 0.75rem;
    }
    .drop.drag { border-color: var(--accent); color: var(--accent); }
    .uname-status {
      margin: -0.35rem 0 0.75rem;
      min-height: 1.25em;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .uname-status.ok { color: var(--accent); }
    .uname-status.bad { color: #8b1e1e; }
    .error {
      margin-top: 1rem;
      color: #8b1e1e;
      display: none;
    }
    .okmsg {
      margin-top: 0.75rem;
      color: var(--accent);
      display: none;
    }
    .panel { display: none; }
    .panel.visible { display: block; }
    .error.visible, .okmsg.visible { display: block; }
    .field {
      margin: 0 0 1rem;
      padding: 0.85rem 1rem;
      background: #f7f3ea;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .field label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .row {
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
    }
    .value {
      flex: 1;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92rem;
      line-height: 1.4;
    }
    .warn {
      margin-top: 1rem;
      padding: 0.75rem 0.9rem;
      background: #fff3d6;
      border-radius: 8px;
      color: #5c4510;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .hint { margin-top: 1rem; color: var(--muted); font-size: 0.95rem; line-height: 1.4; }
    .stack { display: flex; flex-direction: column; gap: 0.6rem; }
    .stack + .stack { margin-top: 0.75rem; }
    #secureAgain { margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <main>
    <h1 data-i18n="title">CrossInk Mail Bridge</h1>
    <div class="nav">
      <button type="button" class="linkish" id="navCreate" data-i18n="navCreate">Create</button>
      <button type="button" class="linkish" id="navLogin" data-i18n="navLogin">Sign in</button>
      <button type="button" class="linkish" id="navAccount" data-i18n="navAccount" hidden>Account</button>
      <button type="button" class="linkish" id="navLogout" data-i18n="logout" hidden>Sign out</button>
    </div>
    <p id="error" class="error" role="alert"></p>
    <p id="okmsg" class="okmsg" role="status"></p>

    <section id="panelCreate" class="panel visible">
      <p class="lede" data-i18n-html="lede"></p>
      <button id="createBtn" type="button" data-i18n="createBtn">Create account</button>
      <p class="hint" data-i18n="multiDevice"></p>
      <p class="hint" data-i18n="retention"></p>

      <section id="result" class="panel" aria-live="polite">
        <div class="field">
          <label data-i18n="labelEmail">Email alias</label>
          <div class="row">
            <div class="value" id="emailValue"></div>
            <button class="secondary" type="button" data-copy="emailValue" data-i18n="copy">Copy</button>
          </div>
        </div>
        <div class="field">
          <label data-i18n="labelToken">Device token</label>
          <div class="row">
            <div class="value" id="tokenValue"></div>
            <button class="secondary" type="button" data-copy="tokenValue" data-i18n="copy">Copy</button>
          </div>
        </div>
        <div class="field">
          <label data-i18n="labelUrl">Bridge URL</label>
          <div class="row">
            <div class="value" id="urlValue"></div>
            <button class="secondary" type="button" data-copy="urlValue" data-i18n="copy">Copy</button>
          </div>
        </div>
        <p class="warn" data-i18n-html="warn"></p>
        <p class="hint" data-i18n="hint"></p>

        <h2 data-i18n="secureTitle">Secure account (optional)</h2>
        <p class="hint" data-i18n="secureHint"></p>
        <input id="regUsername" type="text" maxlength="32" autocomplete="username" data-i18n-placeholder="usernamePh" placeholder="username" />
        <p id="regUsernameStatus" class="uname-status" aria-live="polite"></p>
        <button id="registerPasskeyBtn" type="button" data-i18n="registerPasskey">Register passkey</button>
      </section>
    </section>

    <section id="panelLogin" class="panel">
      <p class="lede" data-i18n="loginLede"></p>
      <input id="loginUsername" type="text" maxlength="32" autocomplete="username" data-i18n-placeholder="usernamePh" placeholder="username" />
      <button id="loginBtn" type="button" data-i18n="loginBtn">Sign in with passkey</button>

      <h2 data-i18n="recoverTitle">Restore with device token</h2>
      <p class="hint" data-i18n="recoverHint"></p>
      <input id="recoverUserId" type="text" maxlength="64" autocomplete="off" data-i18n-placeholder="userIdPh" placeholder="user id" />
      <input id="recoverToken" type="text" maxlength="64" autocomplete="off" data-i18n-placeholder="tokenPh" placeholder="device token" />
      <button id="recoverBtn" type="button" class="secondary" data-i18n="recoverBtn">Restore session</button>
    </section>

    <section id="panelAccount" class="panel">
      <p class="lede" data-i18n="accountLede"></p>
      <div class="field">
        <label data-i18n="labelEmail">Email alias</label>
        <div class="value" id="meEmail"></div>
      </div>
      <div class="field">
        <label data-i18n="labelUsername">Username</label>
        <div class="value" id="meUsername"></div>
      </div>
      <div class="field">
        <label data-i18n="labelPending">Pending books</label>
        <div class="value" id="mePending"></div>
      </div>
      <div id="secureAgain" class="stack" hidden>
        <h2 data-i18n="secureTitle">Secure account (optional)</h2>
        <p class="hint" data-i18n="secureHint"></p>
        <input id="acctRegUsername" type="text" maxlength="32" autocomplete="username" data-i18n-placeholder="usernamePh" placeholder="username" />
        <p id="acctRegUsernameStatus" class="uname-status" aria-live="polite"></p>
        <button id="acctRegisterPasskeyBtn" type="button" data-i18n="registerPasskey">Register passkey</button>
      </div>
      <div class="stack">
        <button id="newTokenBtn" type="button" data-i18n="newToken">Issue new device token</button>
        <button id="logoutBtn" type="button" class="secondary" data-i18n="logout">Sign out</button>
      </div>
      <div id="newTokenBox" class="field" hidden>
        <label data-i18n="labelToken">Device token</label>
        <div class="row">
          <div class="value" id="newTokenValue"></div>
          <button class="secondary" type="button" data-copy="newTokenValue" data-i18n="copy">Copy</button>
        </div>
        <p class="warn" data-i18n="newTokenWarn"></p>
      </div>

      <h2 data-i18n="uploadTitle">Upload books</h2>
      <p class="hint" data-i18n-html="uploadHint"></p>
      <div class="drop" id="dropZone">
        <p data-i18n="dropText">Drop a file here or choose one</p>
        <input id="fileInput" type="file" accept=".epub,.txt,.mobi,.azw3,.docx" />
      </div>
    </section>
  </main>

    function detectLocale() {
      const candidates = [
        ...(navigator.languages || []),
        navigator.language,
        navigator.userLanguage,
      ].filter(Boolean);
      for (const raw of candidates) {
        const lang = String(raw).toLowerCase().split("-")[0];
        if (lang === "de") return "de";
        if (lang === "en") return "en";
      }
      return "en";
    }

    const locale = detectLocale();
    const t = STRINGS[locale] || STRINGS.en;
    document.documentElement.lang = locale;

    function applyI18n() {
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (t[key] != null) el.textContent = t[key];
      });
      document.querySelectorAll("[data-i18n-html]").forEach((el) => {
        const key = el.getAttribute("data-i18n-html");
        if (t[key] != null) el.innerHTML = t[key];
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
        const key = el.getAttribute("data-i18n-placeholder");
        if (t[key] != null) el.placeholder = t[key];
      });
      document.title = t.title;
    }
    applyI18n();

    function showError(msg) {
      okmsg.classList.remove("visible");
      errorEl.textContent = msg || t.errorGeneric;
      errorEl.classList.add("visible");
    }
    function showOk(msg) {
      errorEl.classList.remove("visible");
      okmsg.textContent = msg;
      okmsg.classList.add("visible");
    }
    function clearMsgs() {
      errorEl.classList.remove("visible");
      okmsg.classList.remove("visible");
      errorEl.textContent = "";
      okmsg.textContent = "";
    }

    function randomTokenHex() {
      const bytes = new Uint8Array(32);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
    }

    function bufferToBase64url(buf) {
      const bytes = new Uint8Array(buf);
      let str = "";
      bytes.forEach((b) => { str += String.fromCharCode(b); });
      return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }
    function base64urlToBuffer(b64) {
      const pad = "=".repeat((4 - (b64.length % 4)) % 4);
      const base64 = (b64 + pad).replace(/-/g, "+").replace(/_/g, "/");
      const raw = atob(base64);
      const out = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
      return out.buffer;
    }
    function publicKeyOptionsFromServer(options) {
      const o = structuredClone(options);
      o.challenge = base64urlToBuffer(o.challenge);
      if (o.user && o.user.id) o.user.id = base64urlToBuffer(o.user.id);
      if (o.excludeCredentials) {
        o.excludeCredentials = o.excludeCredentials.map((c) => ({
          ...c,
          id: base64urlToBuffer(c.id),
        }));
      }
      if (o.allowCredentials) {
        o.allowCredentials = o.allowCredentials.map((c) => ({
          ...c,
          id: base64urlToBuffer(c.id),
        }));
      }
      return o;
    }
    function credentialToJSON(cred) {
      const clientDataJSON = bufferToBase64url(cred.response.clientDataJSON);
      const out = {
        id: cred.id,
        rawId: bufferToBase64url(cred.rawId),
        type: cred.type,
        response: { clientDataJSON },
      };
      if (cred.response.attestationObject) {
        out.response.attestationObject = bufferToBase64url(cred.response.attestationObject);
      }
      if (cred.response.authenticatorData) {
        out.response.authenticatorData = bufferToBase64url(cred.response.authenticatorData);
      }
      if (cred.response.signature) {
        out.response.signature = bufferToBase64url(cred.response.signature);
      }
      if (cred.response.userHandle) {
        out.response.userHandle = bufferToBase64url(cred.response.userHandle);
      }
      return out;
    }

    const errorEl = document.getElementById("error");
    const okmsg = document.getElementById("okmsg");
    const createBtn = document.getElementById("createBtn");
    const resultEl = document.getElementById("result");
    const panels = {
      create: document.getElementById("panelCreate"),
      login: document.getElementById("panelLogin"),
      account: document.getElementById("panelAccount"),
    };
    const navAccount = document.getElementById("navAccount");
    const navLogout = document.getElementById("navLogout");
    const navCreate = document.getElementById("navCreate");
    const navLogin = document.getElementById("navLogin");
    let activePanel = "create";
    let hasSession = false;

    function setNavSession(active) {
      hasSession = !!active;
      navAccount.hidden = !hasSession;
      navLogout.hidden = !hasSession;
      // While signed in, Create/Sign-in stay available so the pairing token
      // screen remains reachable, but Account is the primary destination.
    }

    function markNavActive(name) {
      navCreate.classList.toggle("active", name === "create");
      navLogin.classList.toggle("active", name === "login");
      navAccount.classList.toggle("active", name === "account");
    }

    function showPanel(name) {
      clearMsgs();
      Object.values(panels).forEach((p) => p.classList.remove("visible"));
      panels[name].classList.add("visible");
      activePanel = name;
      markNavActive(name);
    }

    async function copyText(text) {
      if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      if (!ok) throw new Error("copy failed");
    }

    document.querySelectorAll("[data-copy]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.getAttribute("data-copy");
        const text = document.getElementById(id).textContent;
        try {
          await copyText(text);
          btn.textContent = t.copied;
          setTimeout(() => { btn.textContent = t.copy; }, 1200);
        } catch (_) {
          btn.textContent = t.copyFailed;
          setTimeout(() => { btn.textContent = t.copy; }, 1200);
        }
      });
    });

    async function refreshMe() {
      const res = await fetch("/v1/web/me", { credentials: "same-origin" });
      if (!res.ok) {
        setNavSession(false);
        document.getElementById("secureAgain").hidden = true;
        return null;
      }
      const body = await res.json();
      document.getElementById("meEmail").textContent = body.email || "";
      document.getElementById("meUsername").textContent = body.username || "—";
      document.getElementById("mePending").textContent = String(body.pending_count ?? 0);
      setNavSession(true);
      const needPasskey = !body.has_passkey;
      document.getElementById("secureAgain").hidden = !needPasskey;
      if (needPasskey) {
        const pref = body.username || "";
        document.getElementById("acctRegUsername").value = pref;
        if (!document.getElementById("regUsername").value) {
          document.getElementById("regUsername").value = pref;
        }
      }
      return body;
    }

    async function registerPasskeyWithUsername(username) {
      if (!window.PublicKeyCredential) throw new Error(t.needPasskey);
      const optRes = await fetch("/v1/web/passkey/register/options", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username }),
      });
      const optBody = await optRes.json().catch(() => ({}));
      if (!optRes.ok) throw new Error(typeof optBody.detail === "string" ? optBody.detail : t.errorGeneric);
      const publicKey = publicKeyOptionsFromServer(optBody.options);
      const cred = await navigator.credentials.create({ publicKey });
      const verRes = await fetch("/v1/web/passkey/register/verify", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          challenge_key: optBody.challenge_key,
          credential: credentialToJSON(cred),
        }),
      });
      const verBody = await verRes.json().catch(() => ({}));
      if (!verRes.ok) throw new Error(typeof verBody.detail === "string" ? verBody.detail : t.errorGeneric);
      return verBody;
    }

    navCreate.addEventListener("click", () => showPanel("create"));
    navLogin.addEventListener("click", () => showPanel("login"));
    navAccount.addEventListener("click", async () => {
      const wasAccount = activePanel === "account";
      try {
        const me = await refreshMe();
        if (!me) {
          showPanel("login");
          showError(t.errorGeneric);
          return;
        }
        showPanel("account");
        if (wasAccount) showOk(t.accountRefreshed);
        panels.account.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (err) {
        showPanel("account");
        showError(String(err.message || err));
      }
    });

    function wireUsernameCheck(inputId, statusId, buttonId) {
      const input = document.getElementById(inputId);
      const statusEl = document.getElementById(statusId);
      const button = document.getElementById(buttonId);
      let timer = null;
      let seq = 0;

      function setStatus(text, kind) {
        statusEl.textContent = text || "";
        statusEl.classList.remove("ok", "bad");
        if (kind) statusEl.classList.add(kind);
      }

      function applyAvailability(status) {
        if (status === "available") {
          setStatus(t.unameAvailable, "ok");
          button.disabled = false;
          return;
        }
        if (status === "own") {
          setStatus(t.unameOwn, "ok");
          button.disabled = false;
          return;
        }
        if (status === "taken") {
          setStatus(t.unameTaken, "bad");
          button.disabled = true;
          return;
        }
        if (status === "invalid") {
          setStatus(t.unameInvalid, "bad");
          button.disabled = true;
          return;
        }
        if (status === "too_short") {
          setStatus(t.unameTooShort, "bad");
          button.disabled = true;
          return;
        }
        setStatus("", null);
        button.disabled = false;
      }

      async function checkNow() {
        const value = input.value.trim();
        const mySeq = ++seq;
        if (!value) {
          setStatus("", null);
          button.disabled = false;
          return;
        }
        if (value.length < 3) {
          applyAvailability("too_short");
          return;
        }
        if (!/^[a-zA-Z0-9_]+$/.test(value)) {
          applyAvailability("invalid");
          return;
        }
        setStatus(t.unameChecking, null);
        try {
          const res = await fetch(
            "/v1/web/username/available?username=" + encodeURIComponent(value),
            { credentials: "same-origin" }
          );
          if (mySeq !== seq) return;
          if (res.status === 401) {
            setStatus("", null);
            button.disabled = false;
            return;
          }
          const body = await res.json().catch(() => ({}));
          if (mySeq !== seq) return;
          applyAvailability(body.status || (body.available ? "available" : "taken"));
        } catch (_) {
          if (mySeq !== seq) return;
          setStatus("", null);
          button.disabled = false;
        }
      }

      input.addEventListener("input", () => {
        if (timer) clearTimeout(timer);
        timer = setTimeout(checkNow, 280);
      });
      input.addEventListener("blur", () => {
        if (timer) clearTimeout(timer);
        checkNow();
      });
    }

    wireUsernameCheck("regUsername", "regUsernameStatus", "registerPasskeyBtn");
    wireUsernameCheck("acctRegUsername", "acctRegUsernameStatus", "acctRegisterPasskeyBtn");

    createBtn.addEventListener("click", async () => {
      clearMsgs();
      createBtn.disabled = true;
      const token = randomTokenHex();
      try {
        const res = await fetch("/v1/accounts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ device_token: token }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (res.status === 429) throw new Error(t.errorRateLimit);
          const detail = body.detail;
          throw new Error(typeof detail === "string" ? detail : (t.errorGeneric + " (HTTP " + res.status + ")"));
        }
        document.getElementById("emailValue").textContent = body.email;
        document.getElementById("tokenValue").textContent = token;
        document.getElementById("urlValue").textContent = window.location.origin;
        resultEl.classList.add("visible");
        createBtn.textContent = t.createdBtn;
        await refreshMe();
      } catch (err) {
        showError(String(err.message || err));
        createBtn.disabled = false;
      }
    });

    document.getElementById("registerPasskeyBtn").addEventListener("click", async () => {
      clearMsgs();
      try {
        const verBody = await registerPasskeyWithUsername(document.getElementById("regUsername").value.trim());
        showOk(verBody.username || "ok");
        await refreshMe();
        showPanel("account");
      } catch (err) {
        showError(String(err.message || err));
      }
    });

    document.getElementById("acctRegisterPasskeyBtn").addEventListener("click", async () => {
      clearMsgs();
      try {
        const verBody = await registerPasskeyWithUsername(document.getElementById("acctRegUsername").value.trim());
        showOk(verBody.username || "ok");
        await refreshMe();
      } catch (err) {
        showError(String(err.message || err));
      }
    });

    document.getElementById("recoverBtn").addEventListener("click", async () => {
      clearMsgs();
      const user_id = document.getElementById("recoverUserId").value.trim();
      const device_token = document.getElementById("recoverToken").value.trim();
      try {
        const res = await fetch("/v1/web/session/bootstrap", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id, device_token }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : t.errorGeneric);
        await refreshMe();
        showPanel("account");
      } catch (err) {
        showError(String(err.message || err));
      }
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      clearMsgs();
      if (!window.PublicKeyCredential) {
        showError(t.needPasskey);
        return;
      }
      const username = document.getElementById("loginUsername").value.trim();
      try {
        const optRes = await fetch("/v1/web/passkey/login/options", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username }),
        });
        const optBody = await optRes.json().catch(() => ({}));
        if (!optRes.ok) throw new Error(typeof optBody.detail === "string" ? optBody.detail : t.errorGeneric);
        const publicKey = publicKeyOptionsFromServer(optBody.options);
        const cred = await navigator.credentials.get({ publicKey });
        const verRes = await fetch("/v1/web/passkey/login/verify", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            challenge_key: optBody.challenge_key,
            credential: credentialToJSON(cred),
          }),
        });
        const verBody = await verRes.json().catch(() => ({}));
        if (!verRes.ok) throw new Error(typeof verBody.detail === "string" ? verBody.detail : t.errorGeneric);
        await refreshMe();
        showPanel("account");
      } catch (err) {
        showError(String(err.message || err));
      }
    });

    document.getElementById("newTokenBtn").addEventListener("click", async () => {
      clearMsgs();
      try {
        const res = await fetch("/v1/web/devices", { method: "POST", credentials: "same-origin" });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : t.errorGeneric);
        document.getElementById("newTokenValue").textContent = body.device_token;
        document.getElementById("newTokenBox").hidden = false;
      } catch (err) {
        showError(String(err.message || err));
      }
    });

    async function doLogout() {
      await fetch("/v1/web/logout", { method: "POST", credentials: "same-origin" });
      document.getElementById("newTokenBox").hidden = true;
      document.getElementById("secureAgain").hidden = true;
      setNavSession(false);
      showPanel("create");
    }

    navLogout.addEventListener("click", () => { doLogout(); });

    document.getElementById("logoutBtn").addEventListener("click", () => { doLogout(); });

    async function uploadFile(file) {
      clearMsgs();
      const fd = new FormData();
      fd.append("file", file, file.name);
      const res = await fetch("/v1/web/upload", {
        method: "POST",
        credentials: "same-origin",
        body: fd,
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = body.detail;
        throw new Error(typeof detail === "string" ? detail : (t.errorGeneric + " (HTTP " + res.status + ")"));
      }
      showOk(t.uploadOk + " " + body.filename);
      await refreshMe();
    }

    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("drag"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag"));
    dropZone.addEventListener("drop", async (e) => {
      e.preventDefault();
      dropZone.classList.remove("drag");
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (!file) return;
      try { await uploadFile(file); } catch (err) { showError(String(err.message || err)); }
    });
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      try { await uploadFile(file); } catch (err) { showError(String(err.message || err)); }
      fileInput.value = "";
    });

    markNavActive("create");
    refreshMe().then((me) => {
      if (me) showPanel("account");
    });
  </script>
</body>
</html>
